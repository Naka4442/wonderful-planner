version: '3.8'

services:
  flask:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SERVER_NAME=wonderfull-planner.ru,чудесный-планер.рф
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
    expose:
      - "5000"
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"  # Для будущего HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/static:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - flask
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge