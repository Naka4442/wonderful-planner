events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Кэширование для статики
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m;
    
    upstream flask_app {
        server flask:5000;
    }
    
    # Основной сервер для обоих доменов
    server {
        listen 80;
        
        # Оба домена
        server_name wonderfull-planner.ru www.wonderfull-planner.ru
                   чудесный-планер.рф www.чудесный-планер.рф;
        
        # Логи отдельно для каждого домена
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
        
        # Корневая директория для favicon и других корневых статических файлов
        root /usr/share/nginx/static;
        
        # Статические файлы - обслуживаем напрямую
        location ~* ^/static/(.+\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|webm|otf))$ {
            alias /usr/share/nginx/static/$1;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, immutable";
            
            # Попробуем разные пути
            try_files $uri /static/$1 =404;
        }
        
        # Явное правило для /static/ (если не сработало выше)
        location /static/ {
            alias /usr/share/nginx/static/;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, immutable";
            
            # Пробуем найти файл
            try_files $uri =404;
        }
        
        # Проверка доступности статики
        location = /static/test.txt {
            alias /usr/share/nginx/static/test.txt;
            add_header Content-Type text/plain;
            return 200 "Static files are working!\n";
        }
        
        # Динамические запросы на Flask
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Для WebSocket если понадобится
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Таймауты
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;
            
            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # Здоровье приложения
        location /health {
            proxy_pass http://flask_app/health;
            access_log off;
        }
        
        # Запрещаем доступ к скрытым файлам
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Кэширование для статических ассетов
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Редирект с www на без www (опционально)
    server {
        listen 80;
        server_name www.wonderfull-planner.ru www.чудесный-планер.рф;
        return 301 $scheme://wonderfull-planner.ru$request_uri;
    }
}