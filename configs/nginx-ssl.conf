events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    upstream flask_app {
        server flask:5000;
    }
    
    # HTTP → HTTPS редирект
    server {
        listen 80;
        server_name wonderfull-planner.ru www.wonderfull-planner.ru
                   чудесный-планер.рф www.чудесный-планер.рф;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS сервер
    server {
        listen 443 ssl http2;
        server_name wonderfull-planner.ru www.wonderfull-planner.ru
                   чудесный-планер.рф www.чудесный-планер.рф;
        
        # SSL сертификаты (пока заглушки)
        ssl_certificate /etc/nginx/ssl/live/wonderfull-planner.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/wonderfull-planner.ru/privkey.pem;
        
        # Настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Статика
        location /static/ {
            alias /usr/share/nginx/static/;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }
        
        # Динамика
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}