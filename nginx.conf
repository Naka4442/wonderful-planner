events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    upstream flask_app {
        server flask:5000;
    }
    
    # HTTP → HTTPS редирект
    server {
        listen 80;
        server_name wonderfull-planner.ru www.wonderfull-planner.ru
                   чудесный-планер.рф www.чудесный-планер.рф
                   xn----7sbbaalcwbe2ag2acee2a7c.xn--p1ai
                   www.xn----7sbbaalcwbe2ag2acee2a7c.xn--p1ai;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS сервер
    server {
        listen 443 ssl;
        http2 on;
        
        server_name wonderfull-planner.ru www.wonderfull-planner.ru
                   чудесный-планер.рф www.чудесный-планер.рф
                   xn----7sbbaalcwbe2ag2acee2a7c.xn--p1ai
                   www.xn----7sbbaalcwbe2ag2acee2a7c.xn--p1ai;
        
        # SSL сертификаты
        ssl_certificate /etc/nginx/ssl/live/wonderfull-planner.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/wonderfull-planner.ru/privkey.pem;
        
        # Современные настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # Статика
        location /static/ {
            alias /usr/share/nginx/static/;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }
        
        # Динамика
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
