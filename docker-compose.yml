version: '3.8'

services:
  flask:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
    expose:
      - "5000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/var/www/static:ro
    depends_on:
      - flask
    networks:
      - app-network

networks:
  app-network:
    driver: bridge